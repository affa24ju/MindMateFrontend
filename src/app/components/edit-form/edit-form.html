<!-- Formulär som visas när man klickar på penna för att redigera ett inlägg -->
<!-- Om editing = true, visar textrutan & knappar -->
@if (editing) {
    <div class="space-y-2 mt-2">
        <textarea [(ngModel)]="note" class="w-full p-2 border rounded"></textarea>
        <!-- Knappar för att spara & avbryta -->
        <div class="flex gap-2">
            <button (click)="save()" class="bg-green-500 text-white px-3 py-1 rounded">Spara</button>
            <button (click)="cancel()" class="bg-gray-300 text-black px-3 py-1 rounded">Avbryt</button>
        </div>
    </div>
}
